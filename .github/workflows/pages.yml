name: 部署到 GitHub Pages

# 推到 main 就自動部署；也可以在 Actions 分頁手動觸發
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不中斷進行中的那個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 會順便把 repo 的 Pages 功能打開，
      # 不用另外進 Settings 設定
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 純靜態網站，沒有建置步驟，整個 repo 根目錄直接上傳
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
